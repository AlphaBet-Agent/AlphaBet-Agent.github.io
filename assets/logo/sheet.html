<!doctype html><html><head><meta charset="utf-8"><style>
body{margin:0;background:#f6f4ed;font-family:"Helvetica Neue",Arial,sans-serif;color:#273b31;padding:40px}
.row{display:flex;gap:48px;align-items:flex-end;margin-bottom:36px}
.cell{display:flex;flex-direction:column;align-items:center;gap:10px}
.lbl{font-size:12px;color:#616b5d}
.dark{background:#273b31;padding:16px;border-radius:12px}
.word{display:flex;align-items:center;gap:8px;font-family:"Iowan Old Style",Palatino,serif;font-size:26px}
</style></head><body>
<!-- A: alpha swoosh with arrow -->
<svg width="0" height="0" style="position:absolute"><defs>
<symbol id="A" viewBox="0 0 32 32"><path d="M26 25 C21 21 17 12 10.5 12 C6 12 4.5 17.5 6.5 22 C8.5 26.5 14 26 17 21.5 C19.5 17.5 23 11.5 27 7.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M21.5 7.5 H27 V13" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
<!-- B: A whose crossbar is a timeline with three date dots and a star apex -->
<symbol id="B" viewBox="0 0 32 32"><path d="M5 28 L16 5 L27 28" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M9.5 20 H22.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><circle cx="12" cy="20" r="1.9" fill="#f6f4ed" stroke="currentColor" stroke-width="1.6"/><circle cx="16" cy="20" r="1.9" fill="#f6f4ed" stroke="currentColor" stroke-width="1.6"/><circle cx="20" cy="20" r="2.2" fill="currentColor"/></symbol>
<!-- C: alpha as a loop with a straight rising tail and a terracotta dot (the outcome) -->
<symbol id="C" viewBox="0 0 32 32"><path d="M24 24.5 C19.5 24.5 16.5 14 10.5 14 C6.5 14 5.5 19.5 7.5 23 C9.5 26.5 14.5 25.5 17 21.5 L26 8" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><circle cx="26.5" cy="7.5" r="2.6" fill="#9d593f"/></symbol>
<!-- D: four-point star over a baseline (the AlphaBet marker) -->
<symbol id="D" viewBox="0 0 32 32"><path d="M16 4 L18.6 13.4 L28 16 L18.6 18.6 L16 28 L13.4 18.6 L4 16 L13.4 13.4 Z" fill="currentColor"/></symbol>
<!-- E: A with the right leg continuing up into an arrow -->
<symbol id="E" viewBox="0 0 32 32"><path d="M5 27 L15 6 L22 20.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/><path d="M9 19.5 H19" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M17 27 L28 10" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"/><path d="M22.5 9.5 H28.5 V15.5" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></symbol>
</defs></svg>
<div class="row">
 <div class="cell"><svg width="160" height="160"><use href="#A"/></svg><span class="lbl">A · alpha swoosh → arrow</span></div>
 <div class="cell"><svg width="160" height="160"><use href="#B"/></svg><span class="lbl">B · A, crossbar = dated timeline</span></div>
 <div class="cell"><svg width="160" height="160"><use href="#C"/></svg><span class="lbl">C · alpha loop + rising tail + outcome dot</span></div>
 <div class="cell"><svg width="160" height="160"><use href="#D"/></svg><span class="lbl">D · the star marker</span></div>
 <div class="cell"><svg width="160" height="160"><use href="#E"/></svg><span class="lbl">E · A whose leg becomes an arrow</span></div>
</div>
<div class="row">
 <div class="word"><svg width="28" height="28"><use href="#A"/></svg>AlphaBet</div>
 <div class="word"><svg width="28" height="28"><use href="#B"/></svg>AlphaBet</div>
 <div class="word"><svg width="28" height="28"><use href="#C"/></svg>AlphaBet</div>
 <div class="word"><svg width="28" height="28"><use href="#D"/></svg>AlphaBet</div>
 <div class="word"><svg width="28" height="28"><use href="#E"/></svg>AlphaBet</div>
</div>
<div class="row">
 <div class="dark"><svg width="40" height="40" style="color:#f6f4ed"><use href="#A"/></svg></div>
 <div class="dark"><svg width="40" height="40" style="color:#f6f4ed"><use href="#B"/></svg></div>
 <div class="dark"><svg width="40" height="40" style="color:#f6f4ed"><use href="#C"/></svg></div>
 <div class="dark"><svg width="40" height="40" style="color:#f6f4ed"><use href="#D"/></svg></div>
 <div class="dark"><svg width="40" height="40" style="color:#f6f4ed"><use href="#E"/></svg></div>
</div>
<div class="row">
 <svg width="16" height="16"><use href="#A"/></svg><svg width="16" height="16"><use href="#B"/></svg><svg width="16" height="16"><use href="#C"/></svg><svg width="16" height="16"><use href="#D"/></svg><svg width="16" height="16"><use href="#E"/></svg>
</div>
</body></html>
